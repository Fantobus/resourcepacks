name: Update manifest
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.zip"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/generate.py resourcepacks . .zip resourcepacks.json Fantobus/resourcepacks
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resourcepacks.json
          git diff --cached --quiet || git commit -m "Auto-update manifest"
          git push
